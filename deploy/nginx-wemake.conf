# WeMake behind nginx. Cloudflare (or any proxy) terminates TLS in front of this.
map $http_upgrade $wemake_connection { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 300m;        # recorded takes / imported audio (Cloudflare Free caps bodies at 100 MB)

    location /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wemake_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;        # long-lived session sockets
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /api/audio/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;  # stream uploads straight to disk
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
