name: Build and Push to GHCR

on:
  push:
    branches:
      - main # Triggers the build when you push to main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # Automatically uses your username/repo-name

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # These permissions are required for the GITHUB_TOKEN to push to GHCR
    permissions:
      contents: read
      packages: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tags the image as 'latest' on every push to main
            type=raw,value=latest 

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
